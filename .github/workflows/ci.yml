name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build for Apple silicon and Intel
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/Uso"
          for arch in arm64 x86_64; do lipo "$bin" -verify_arch "$arch"; done
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Check script syntax
        run: |
          bash -n scripts/get.sh
          zsh -n scripts/install.sh scripts/package.sh scripts/sign-identity.sh

  installer:
    name: Shellcheck installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/get.sh
